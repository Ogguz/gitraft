run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - gocritic

# Lint exclusions are scoped narrowly so real bugs aren't silenced. Each
# entry below documents *why* the pattern is intentional — without that
# the next maintainer would (rightly) wonder whether the suppression is
# papering over something.
issues:
  exclude-use-default: false

  exclude-rules:
    # Idiomatic Go: `defer resp.Body.Close()` is the canonical close pattern.
    # The error from close-after-read is meaningless to the caller (the
    # response body has already been consumed); ignoring it is universally
    # accepted style — see net/http examples in the stdlib docs.
    - linters: [errcheck]
      source: "defer.*\\.Close\\(\\)"

    # Test cleanup paths intentionally ignore errors. `os.RemoveAll(tmp)` in
    # a TestMain or t.Cleanup is best-effort — a failure to clean a temp
    # dir doesn't change test correctness, and surfacing it would just
    # flake the test run.
    - linters: [errcheck]
      path: _test\.go
      source: "os\\.RemoveAll"

    # Two intentional os.Exit-after-defer sites:
    #
    # cmd/gitraft/main.go: signal.NotifyContext's stop() is registered via
    # defer, but on the os.Exit(1) path the OS process termination handles
    # signal cleanup anyway — there's nothing for stop() to release that
    # outlives the process.
    #
    # cmd/gitraft/main_test.go: TestMain calls os.MkdirTemp + defer
    # os.RemoveAll(tmp) followed by os.Exit(m.Run()). The Go test
    # harness already cleans temp dirs created via t.TempDir; this
    # extra defer is a belt-and-suspenders that genuinely never runs.
    - linters: [gocritic]
      text: "exitAfterDefer"
      path: cmd/gitraft/

    # Test functions that document a contract via comments but make no
    # assertions don't use `t` — renaming to `_` would obscure the test
    # signature (the linter's suggestion). Suppress at the test-file level
    # since this only happens in a few documentation-only tests.
    - linters: [revive]
      text: "unused-parameter.*'t'"
      path: _test\.go

    # httptest.HandlerFunc closures often only inspect the request URL or
    # write a static response, leaving `r` unused. Renaming to `_` works
    # but obscures the standard handler signature; suppress in test files.
    - linters: [revive]
      text: "unused-parameter.*'r'"
      path: _test\.go

    # Unused `u` parameter in test stubs that override package-level
    # function vars (e.g., authURLFn): the stub satisfies the function
    # signature but doesn't need the URL.
    - linters: [revive]
      text: "unused-parameter.*'u'"
      path: _test\.go
